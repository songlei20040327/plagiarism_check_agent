<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>阈值标注审核 · 第一轮</title>
<style>
:root{--ink:#182b38;--muted:#61747f;--line:#dce4e9;--blue:#155c78;--green:#236753;--bg:#f3f6f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #b8cbd4;border-radius:8px;background:white;padding:8px 13px;color:var(--ink)}button:hover{background:#edf5f8}button:disabled{opacity:.4;cursor:default}a{color:var(--blue)}
header{background:#142f3c;color:white;padding:24px 32px;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:24px;margin:0 0 5px}header p{margin:0;color:#cbdbe2;font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}header button{background:#fff}.layout{display:grid;grid-template-columns:244px minmax(0,1fr);max-width:1700px;margin:auto;min-height:85vh}
aside{padding:24px 17px;border-right:1px solid var(--line)}aside h2{font-size:15px;margin:0 0 8px}.progress{height:7px;background:#d6e1e6;border-radius:6px;overflow:hidden;margin:10px 0 18px}.progress span{display:block;height:100%;background:var(--green)}.nav-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.nav-grid button{padding:8px 1px;font-size:12px}.nav-grid .active{outline:2px solid var(--blue);outline-offset:1px}.nav-grid .done{background:#dceee4;color:#174c39}.note{font-size:12px;color:var(--muted)}.aside-note{margin-top:24px;border-top:1px solid var(--line);padding-top:15px}
main{padding:25px 30px 50px;min-width:0}.notice{background:#eaf2f5;border-left:4px solid var(--blue);padding:12px 16px;margin-bottom:21px;border-radius:4px;font-size:13px}.case-head{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:17px}.case-head h2{margin:0;font-size:22px}.badge{display:inline-block;border-radius:5px;background:#e3edf3;color:#23556e;padding:2px 8px;font-size:12px;margin-right:6px}.badge.constructed{background:#f8ead2;color:#805a16}.status{font-size:13px;color:var(--muted);white-space:nowrap}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}.panel-head{padding:14px 18px;border-bottom:1px solid var(--line);background:#fafcfd}.panel-head h3{margin:0;font-size:16px}.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin-top:5px}.text{white-space:pre-wrap;overflow-wrap:anywhere;font:16px/1.95 "Songti SC","SimSun",serif;padding:19px 21px;max-height:630px;overflow:auto}.context{padding:0 18px 15px;font-size:13px}.context pre{font:13px/1.8 inherit;white-space:pre-wrap;max-height:330px;overflow:auto;color:#4b606b}.context summary,details summary{cursor:pointer;color:var(--blue)}
details.info{background:white;border:1px solid var(--line);border-radius:9px;padding:13px 17px;margin-top:15px}details.info p{margin:8px 0;font-size:14px}pre.scores{font:12px/1.7 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.review{margin-top:19px;background:white;border:1px solid #b6cbd5;border-radius:12px;padding:20px}.review h3{margin:0 0 13px;font-size:17px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}label{display:block;font-size:13px;font-weight:600}select,textarea,input[type=text]{width:100%;border:1px solid #b8cbd4;border-radius:7px;background:white;color:var(--ink);padding:10px;margin-top:6px}textarea{height:88px;resize:vertical;font-weight:400}.review-footer{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:15px}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover{background:#0b4963}.toolbar{display:flex;justify-content:space-between;margin-top:17px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:11px 21px;background:#143b4a;color:white;border-radius:8px;max-width:85vw;z-index:10;display:none}.reviewer{margin-top:18px}.small{font-size:12px}.empty{color:#82939d;font-style:italic}
@media(max-width:1050px){.layout{grid-template-columns:170px minmax(0,1fr)}main{padding:20px}.pair{grid-template-columns:1fr}.text{max-height:440px}.nav-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){header{padding:19px;display:block}.actions{margin-top:14px}.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line);padding:15px}.nav-grid{grid-template-columns:repeat(8,1fr)}.aside-note,.reviewer{display:none}main{padding:15px}.form-grid{grid-template-columns:1fr}.review-footer{align-items:stretch;flex-direction:column}.case-head{gap:8px}h1{font-size:21px}}
</style>
</head>
<body>
<header><div><h1>阈值标注审核 · 第一轮</h1><p>先读原文，再形成判断。40 组开发样本，不用于宣称测试准确率。</p></div><div class="actions"><button id="import">导入审核备份</button><button id="export">导出审核结果</button></div></header>
<div class="layout"><aside><h2 id="progress-label"></h2><div class="progress"><span id="progress-bar"></span></div><div class="nav-grid" id="nav"></div><div class="reviewer"><label>审核人（可选）<input id="reviewer" type="text" placeholder="姓名或代号"></label></div><div class="aside-note note">选择与备注会保存在当前浏览器。完成后请导出 JSON 备份，再把保存路径告诉我。<br><br>我的建议、模型分数默认折叠；未审核的样本不会自动采用建议。<br><br>同主题、同术语、同公式，不足以直接认定抄袭。引文是否恰当需要结合上下文。</div></aside>
<main><div class="notice">只审核当前两段的关系，不对整篇论文作结论。每组填写“判定”和“引用情况”，再点击确认。信息不足可选“不确定”，并说明缺什么。</div><section id="case"></section></main></div>
<div class="toast" role="status" id="toast"></div><input hidden type="file" accept="application/json,.json" id="file-input">
<script id="pack-data" type="application/json">__PACK_JSON__</script>
<script>
"use strict";
const pack=JSON.parse(document.getElementById('pack-data').textContent);
const decisions={no_issue:'无问题：独立表达 / 公共知识 / 恰当引用',verbatim:'逐字重复：需要标记的实质文字复制',near_paraphrase:'近义改写：需要标记的实质改写',idea_overlap:'观点重合：仍需进一步核查',uncertain:'不确定：证据或专业判断不足'};
const attributions={adequate:'引用与标识恰当',missing_or_unclear:'缺少引用或引用范围不清',not_applicable:'不涉及引用问题',uncertain:'不确定，需要更多上下文'};
const storageKey='plagiarism-review:'+pack.batch_id;
const blank=()=>({schema_version:1,batch_id:pack.batch_id,reviewer:'',annotations:pack.cases.map(c=>({case_id:c.id,case_hash:c.case_hash,decision:'',attribution:'',note:'',confirmed:false}))});
let state=blank(), current=0, timer;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(message){$('toast').textContent=message;$('toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('toast').style.display='none',5000)}
function validated(value){
 if(value.batch_id!==pack.batch_id||!Array.isArray(value.annotations))throw Error('不是本轮审核的备份文件');
 const seen=new Set(), result=blank();
 for(const r of value.annotations){const i=pack.cases.findIndex(c=>c.id===r.case_id);if(i<0||seen.has(r.case_id)||r.case_hash!==pack.cases[i].case_hash)throw Error('样本编号重复、未知或内容版本不同');seen.add(r.case_id);
  if(typeof r.confirmed!=='boolean'||typeof(r.note??'')!=='string'||(!Object.hasOwn(decisions,r.decision)&&r.decision!=='')||(!Object.hasOwn(attributions,r.attribution)&&r.attribution!==''))throw Error('审核字段不合法');
  if(r.confirmed&&(!r.decision||!r.attribution))throw Error('已确认样本缺少判定或引用情况');result.annotations[i]={...r};}
 result.reviewer=typeof value.reviewer==='string'?value.reviewer:'';return result;
}
try{const saved=localStorage.getItem(storageKey);if(saved)state=validated(JSON.parse(saved))}catch(e){notify('未能恢复本地备份：'+e.message)}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch(e){notify('浏览器无法自动保存，请及时导出备份')}updateProgress()}
function updateProgress(){const done=state.annotations.filter(r=>r.confirmed).length;$('progress-label').textContent=`已确认 ${done} / ${pack.cases.length} 组`;$('progress-bar').style.width=100*done/pack.cases.length+'%';$('nav').innerHTML=pack.cases.map((c,i)=>`<button class="${i===current?'active ':''}${state.annotations[i].confirmed?'done':''}" data-index="${i}" aria-label="查看 ${c.id}">${c.id}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{current=Number(b.dataset.index);render()});}
function readable(text){return String(text).normalize('NFKC').replace(/[\uE000-\uF8FF]/g,'').replace(/\s+/g,' ').replace(/(?<=[\u4e00-\u9fff,.;:!?，。！？；：、（）“”]) (?=[\u4e00-\u9fff,.;:!?，。！？；：、（）“”])/g,'').trim()}
function panel(item,label){
 const constructed=item.kind==='constructed',pages=(item.pdf_pages||[]).join('、');
 const link=constructed?'构造文本，无待测论文页码':`PDF 第 ${esc(pages)} 页 · chunk ${item.chunk_index}`;
 const href=constructed?'':encodeURI(item.pdf_relative_path)+'#page='+item.pdf_pages[0];
 const locator=!constructed&&location.protocol==='file:'?`<a href="${esc(href)}" target="_blank" rel="noopener">${link} · 打开原 PDF</a>`:link;
 const scans=(item.page_images||[]).map(img=>`<p class="note">PDF 第 ${img.page} 页（物理页码）</p><img loading="lazy" style="width:100%;height:auto;border:1px solid #dce4e9" src="${esc(img.path)}" alt="PDF 第 ${img.page} 页原文图">`).join('');
 return `<article class="panel"><div class="panel-head"><h3>${label}</h3><div class="meta">${esc(item.file_name||item.title||'构造对照')}<br>${locator}${constructed?'':'<br>已整理换行与排版字符；公式和疑似错字请核对原页图'}</div></div><div class="text">${esc(constructed?item.text:readable(item.text))}</div>${scans?`<details class="context"><summary>查看 PDF 原页图（第 ${esc(pages)} 页）</summary>${scans}</details>`:''}<details class="context"><summary>展开前后文与来源说明</summary>${constructed?`<p>${esc(item.construction_note)}</p>`:`<p class="note">前一 chunk（含运行时重叠）</p><pre>${esc(readable(item.context_before||'无'))}</pre><p class="note">后一 chunk（含运行时重叠）</p><pre>${esc(readable(item.context_after||'无'))}</pre><p class="note">定位方法：${esc(item.location_method)}</p><details><summary>原始提取文本（未清理）</summary><pre>${esc(item.text)}</pre></details>`}</details></article>`;
}
function options(map,value){return '<option value="">请选择，不默认采用建议</option>'+Object.entries(map).map(([k,v])=>`<option value="${k}" ${value===k?'selected':''}>${esc(v)}</option>`).join('')}
function render(){
 const c=pack.cases[current], row=state.annotations[current], natural=c.origin==='natural', probe=c.origin==='probe';
 $('case').innerHTML=`<div class="case-head"><div><span class="badge ${natural||probe?'':'constructed'}">${natural?'真实论文候选':probe?'真实原文 · 召回补充核查':'构造对照 · 非论文发现'}</span><span class="badge">开发集审核</span><h2>${c.id} · ${esc(c.purpose)}</h2></div><div class="status">${row.confirmed?'已确认':'待审核'} · ${current+1}/${pack.cases.length}</div></div><div class="pair">${panel(c.query,'待测文字')}${panel(c.source,'参考来源')}</div><details class="info"><summary>查看我的初步建议（可不同意）</summary><p><b>建议：</b>${esc(decisions[c.advice.decision]||c.advice.decision)}</p><p><b>引用判断：</b>${esc(attributions[c.advice.attribution]||c.advice.attribution)}</p><p>${esc(c.advice.reason)}</p><p class="note">待核验：${esc(c.advice.check)}。这是初步建议，不是最终评测标签。</p></details><details class="info"><summary>模型分数与取样信息（不等于重复概率）</summary><pre class="scores">${esc(JSON.stringify({scores:c.scores,channels:c.channels,rank:c.rank,diagnostics:c.diagnostics,origin:c.origin},null,2))}</pre><p class="note">空分数表示尚未计算，不代表零分。重排模型最多读取 512 tokens 的文本对，完整原文仍供人工审核。本批按主题和候选排名选取，构造对照另行补充；不能直接计算真实使用中的准确率。批次 ${esc(pack.batch_id)}</p></details><div class="review"><h3>你的审核意见</h3><div class="form-grid"><label>最终判定<select id="decision">${options(decisions,row.decision)}</select></label><label>引用情况<select id="attribution">${options(attributions,row.attribution)}</select></label></div><label style="margin-top:14px">理由 / 需要补充的证据<textarea id="note" placeholder="例如：只是 PID 公共公式；已给出引号和完整来源；需要核对下一页……">${esc(row.note)}</textarea></label><div class="review-footer"><span class="note">修改已确认意见后，需要再次确认。也可以先保存为未确认草稿。</span><button class="primary" id="confirm">确认本组并下一组</button></div></div><div class="toolbar"><button id="previous" ${current===0?'disabled':''}>← 上一组</button><button id="next" ${current===pack.cases.length-1?'disabled':''}>下一组 →</button></div>`;
 for(const id of ['decision','attribution','note'])$(id).addEventListener(id==='note'?'input':'change',()=>{row[id]=$(id).value;row.confirmed=false;delete row.reviewed_at;save();document.querySelector('.status').textContent=`待审核 · ${current+1}/${pack.cases.length}`});
 $('confirm').onclick=()=>{if(!row.decision||!row.attribution)return notify('请先选择判定和引用情况；信息不足可选“不确定”');row.confirmed=true;row.reviewed_at=new Date().toISOString();save();const next=state.annotations.findIndex((r,i)=>i>current&&!r.confirmed);if(next>=0)current=next;else if(current<pack.cases.length-1)current++;render();notify('已确认并保存；完成后请导出备份')};
 $('previous').onclick=()=>{if(current>0){current--;render()}};$('next').onclick=()=>{if(current<pack.cases.length-1){current++;render()}};updateProgress();
}
$('reviewer').value=state.reviewer;$('reviewer').oninput=()=>{state.reviewer=$('reviewer').value;save()};
$('export').onclick=()=>{const result={...state,exported_at:new Date().toISOString()};const blob=new Blob([JSON.stringify(result,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=pack.batch_id+'-annotations.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已导出审核结果，可以保留部分进度后继续审核')};
$('import').onclick=()=>$('file-input').click();$('file-input').onchange=async event=>{const file=event.target.files[0];if(!file)return;try{const result=validated(JSON.parse(await file.text()));if(state.annotations.some(r=>r.confirmed)&&!confirm('导入将替换本浏览器的审核进度，继续吗？'))return;state=result;$('reviewer').value=state.reviewer;save();render();notify('审核备份已导入')}catch(e){notify('导入失败：'+e.message)}finally{event.target.value=''}};
render();
</script>
</body>
</html>
